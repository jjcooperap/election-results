<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Arizona 2026 Election Results</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 40px 20px; }
    .embed-wrapper { width: 100%; max-width: 800px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 20px; }
    h1 { margin-bottom: 24px; font-size: 26px; }
    h2 { margin: 28px 0 14px; font-size: 20px; }
    iframe { display: block; }
  </style>
</head>
<body>
  <main class="embed-wrapper">
    <h1>Arizona 2026 Election Results</h1>
    <iframe class="ap-embed" loading="lazy" title="Live election results via the Associated Press" src="https://interactives.apelections.org/election-results/customers/layouts/organization-layouts/published/49221/33185.html" width="100%" frameborder="0" scrolling="no" marginheight="0"></iframe>
    <h2>Legislature</h2>
    <iframe class="ap-embed" loading="lazy" title="Live election results via the Associated Press — Legislature" src="https://interactives.apelections.org/election-results/customers/layouts/organization-layouts/published/49221/38725.html" width="100%" frameborder="0" scrolling="no" marginheight="0"></iframe>
    <iframe class="ap-embed" loading="lazy" title="Live election results via the Associated Press" src="https://interactives.apelections.org/election-results/customers/layouts/organization-layouts/published/49221/37197.html" width="100%" frameborder="0" scrolling="no" marginheight="0"></iframe>
  </main>
  <script defer src="https://interactives.apelections.org/election-results/assets/microsite/resizeClient.js"></script>
</body>
</html>
